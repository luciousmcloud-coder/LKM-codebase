name: Build LKM Codebase Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Windows Installer
            os: windows-2022
            build_command: pnpm desktop:dist:win
            artifact_glob: release/*.exe
          - name: macOS DMG
            os: macos-13
            build_command: pnpm desktop:dist:mac
            artifact_glob: release/*.dmg
          - name: Linux AppImage
            os: ubuntu-22.04
            build_command: pnpm desktop:dist:linux
            artifact_glob: release/*.AppImage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: matrix.target.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fuse libfuse2

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop artifact
        run: ${{ matrix.target.build_command }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: ${{ matrix.target.artifact_glob }}
          if-no-files-found: error
